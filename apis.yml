aid: horizoniq
name: HorizonIQ
description: >-
  HorizonIQ (formerly INAP / Internap) is a US infrastructure provider delivering fully managed
  private cloud, bare metal servers, and GPU dedicated servers, along with block and object storage,
  backup and recovery, connectivity, load balancing, firewalls, and DDoS mitigation across its data
  center footprint. Its Compass platform gives customers self-service provisioning, monitoring, and
  automation, exposed programmatically through the Compass REST API for managing servers, devices,
  managed firewalls, OS images, SSL certificates, billing, users, action items, and support cases.
  HorizonIQ holds SOC 2 Type II, ISO 27001, and PCI DSS certifications.
