      tags:
      - Action Items
      operationId: getActionItemsByActionItemUUID
  /action-items:
    get:
      description: Retrieves a JSON object containing a list of all system action items grouped by category.
      parameters:
      - description: Limits the number of returned objects.
        in: query
        name: limit
        schema:
          type: string
      - description: Name of key on which to sort object list.
        in: query
        name: sortby
        schema:
          type: string
      - description: Designates the start index of the object list.
        in: query
        name: offset
        schema:
          type: string
      - description: Required with Compass API token.<br>Provide keyword **Bearer** and space before token.
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - in: query
        name: filterBy
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionItemsGroupListModel'
          description: 200 response
      summary: List Grouped Action Items
      tags:
      - Action Items
      operationId: getActionItems
