openapi: 3.0.1
info:
  title: Compass API
  version: '2023-05-30T22:28:43Z'
  description: HorizonIQ Compass REST API - manage bare metal and cloud infrastructure resources (servers,
    devices, managed firewalls, OS images, SSL certificates, billing, users, support cases, and action
    items) on the HorizonIQ (formerly INAP) Compass platform. Assembled from the per-endpoint OpenAPI
    fragments published at https://compass-horizoniq.readme.io/reference; operationIds and the documented
    Bearer securityScheme added by API Evangelist.
servers:
- url: https://api.compass.horizoniq.com/{basePath}
  variables:
    basePath:
      default: v1
security:
- bearerAuth: []
tags:
- name: Action Items
  description: Endpoints related to Action Items
- name: Billing
  description: Endpoints related to Billing
- name: Devices
  description: Endpoints related to devices
- name: Images
  description: Endpoints related to images
- name: Managed Firewalls
  description: Endpoints related to managed firewalls
- name: Servers
  description: Endpoints related to Servers
- name: Support
  description: Endpoints related to support cases
- name: User Accounts
  description: Enpionts related to user accounts
paths:
  /users/{userUUID}:
    delete:
      description: Delete user account
      parameters:
      - description: The UUID of the user, can be retrieved from the user list endpoint.
        in: path
        name: userUUID
        required: true
        schema:
          type: string
      - description: Required with Compass API token.<br>Provide keyword **Bearer** and space before token.
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessModel'
          description: 200 response
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: 500 response
      summary: Delete User Account
      tags:
      - User Accounts
      operationId: deleteUsersByUserUUID
    get:
      description: Retrieves a JSON object containing a single user account by userUUID.
      parameters:
      - description: The UUID of the user, can be retrieved from the user list endpoint.
        in: path
        name: userUUID
        required: true
        schema:
          type: string
      - description: Required with Compass API token.<br>Provide keyword **Bearer** and space before token.
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGetModel'
          description: 200 response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: 404 response
      summary: Get User Account
      tags:
      - User Accounts
      operationId: getUsersByUserUUID
    patch:
      description: Update user account
      parameters:
      - description: The UUID of the user, can be retrieved from the user list endpoint.
        in: path
        name: userUUID
        required: true
        schema:
          type: string
      - description: Required with Compass API token.<br>Provide keyword **Bearer** and space before token.
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdatePatchModel'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddResponseModel'
          description: 200 response
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: 500 response
      summary: Update User Account
      tags:
      - User Accounts
      operationId: updateUsersByUserUUID
  /action-items/{actionItemUUID}:
    get:
      description: Retrieves a JSON object containing a single action item by UUID.
      parameters:
      - description: The UUID of the action item, can be retrieved from the action item list endpoint.
